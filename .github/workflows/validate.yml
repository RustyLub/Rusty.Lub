name: Validate Rusty.Lub

on:
  push:
    branches: ["release/production-readiness"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: TypeScript checks
        run: npm run lint
      - name: Build website
        run: npm run build
        env:
          NODE_ENV: production
          GITHUB_ACTIONS: "true"
          VITE_BASE: "./"
