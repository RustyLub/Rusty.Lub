name: Build and verify website

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build static website
        run: bun run build
        env:
          NODE_ENV: production
          VITE_BASE: "./"

      - name: Build Firebase API function
        run: bun run build:functions

      - name: Verify Firebase API function bundle
        run: test -s functions/index.cjs

      - name: Verify website and SEO files
        run: |
          test -s dist/index.html
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          test -s dist/raid-calculator/index.html
          test -s dist/mixing-table/index.html
          test -s dist/recycler-calculator/index.html
          test -s dist/fps-optimization/index.html
          test -s dist/rust-binds/index.html
          test -s dist/rust-errors/index.html

      - name: Upload built website
        uses: actions/upload-artifact@v4
        with:
          name: rusty-lub-static-site
          path: dist/
          if-no-files-found: error
          retention-days: 7
