name: Build & Release Windows Tauri 2 App

on:
  push:
    branches:
      - 'release/windows-desktop-v3'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Keep only the newest build for this release branch; each commit otherwise queues another installer build.
concurrency:
  group: rusty-lub-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and Publish Tauri 2 Windows Release
    runs-on: windows-latest
    env:
      # GitHub Pages uses /Rusty.Lub/, but Tauri loads bundled assets from its app origin.
      VITE_BASE: './'
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify relative asset paths for Tauri
        shell: pwsh
        run: |
          $html = Get-Content dist/index.html -Raw
          if ($html -match '(src|href)="/(Rusty\.Lub/)?assets/') {
            throw "Desktop build contains root-relative asset paths. VITE_BASE must be ./"
          }
          if ($html -notmatch '(src|href)="\./assets/') {
            throw "Desktop build does not contain expected relative asset paths."
          }
          Write-Host "Verified: Tauri frontend assets use relative paths."

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Rusty.Lub v__VERSION__'
          releaseBody: 'Rusty.Lub Windows Desktop v3.0.2. Fixes relative asset paths for the Tauri WebView startup. Industrial Steel desktop workspace, dedicated application settings centre, saved display preferences, notification and keyboard shortcut sections, version/about information, and preserved Rust/HUD launcher settings. Includes Windows x64 NSIS (.exe), MSI (.msi), and Tauri updater artifacts.'
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
