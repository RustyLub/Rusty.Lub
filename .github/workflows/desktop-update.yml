name: Build & Release Windows Tauri 2 App

on:
  push:
    branches:
      - 'release/windows-desktop-v3'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Tauri 2 Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Rusty.Lub v__VERSION__'
          releaseBody: 'Official release of Rusty.Lub Windows Desktop Edition built with Tauri 2. Includes signed NSIS (.exe), MSI (.msi) installers, and latest.json update manifest for in-app Tauri 2 updater.'
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
