name: Deploy Firebase authentication API

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "functions/**"
      - "src/server/**"
      - "src/lib/firebase-admin.ts"
      - "firebase.json"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: firebase-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build Firebase function
        run: bun run build:functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RUSTYLUB }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API function
        run: npx --yes firebase-tools deploy --only functions:apiServer --project rustylub --non-interactive
