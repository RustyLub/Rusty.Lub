name: Discord WebRCON Bot

on:
  push:
    branches: [main, "feat/discord-vanilla-webrcon-control"]
    paths:
      - "discord-bot/**"
      - ".github/workflows/discord-bot.yml"
  pull_request:
    paths:
      - "discord-bot/**"
      - ".github/workflows/discord-bot.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
