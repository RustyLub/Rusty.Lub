    <script>
      window.__rusty_errors = [];

      // Intercept Vite HMR WebSocket in cloud sandbox preview environment to prevent connection failures
      (function() {
        if (typeof window === 'undefined') return;
        var OriginalWebSocket = window.WebSocket;
        if (!OriginalWebSocket) return;

        function isViteHmr(url, protocols) {
          if (protocols === 'vite-hmr') return true;
          if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) return true;
          var strUrl = typeof url === 'string' ? url : (url && url.href ? String(url.href) : '');
          if (strUrl) {
            if (strUrl.indexOf('vite-hmr') !== -1) return true;
            if (strUrl.indexOf('token=') !== -1 && strUrl.indexOf('socket.io') === -1) return true;
            if (strUrl.indexOf('/@vite/') !== -1) return true;
          }
          return false;
        }

        function DummyViteHmrSocket(url, protocols) {
          this.url = String(url || '');
          this.protocols = protocols;
          this.readyState = 1; // WebSocket.OPEN
          this.CONNECTING = 0;
          this.OPEN = 1;
          this.CLOSING = 2;
          this.CLOSED = 3;
          this.binaryType = 'blob';
          this.bufferedAmount = 0;
          this.extensions = '';
          this.protocol = typeof protocols === 'string' ? protocols : 'vite-hmr';
          this.onopen = null;
          this.onclose = null;
          this.onerror = null;
          this.onmessage = null;
          this._listeners = {};

          var self = this;
          setTimeout(function() {
            if (typeof self.onopen === 'function') {
              try { self.onopen({ type: 'open', target: self }); } catch(err){}
            }
          }, 0);
        }

        DummyViteHmrSocket.prototype.send = function() {};
        DummyViteHmrSocket.prototype.close = function() {
          this.readyState = 3;
          if (typeof this.onclose === 'function') {
            try { this.onclose({ type: 'close', code: 1000, reason: 'normal', wasClean: true, target: this }); } catch(err){}
          }
          var closeHandlers = this._listeners['close'];
          if (Array.isArray(closeHandlers)) {
            var evt = { type: 'close', code: 1000, reason: 'normal', wasClean: true, target: this };
            closeHandlers.forEach(function(h) { try { h(evt); } catch(e){} });
          }
        };
        DummyViteHmrSocket.prototype.addEventListener = function(event, handler) {
          if (!this._listeners[event]) this._listeners[event] = [];
          this._listeners[event].push(handler);
          if (event === 'open') {
            var self = this;
            setTimeout(function() {
              try { handler({ type: 'open', target: self }); } catch(err){}
            }, 0);
          }
        };
        DummyViteHmrSocket.prototype.removeEventListener = function(event, handler) {
          if (!this._listeners[event]) return;
          this._listeners[event] = this._listeners[event].filter(function(h) { return h !== handler; });
        };
        DummyViteHmrSocket.prototype.dispatchEvent = function() {
          return true;
        };

        function PatchedWebSocket(url, protocols) {
          if (isViteHmr(url, protocols)) {
            return new DummyViteHmrSocket(url, protocols);
          }
          if (protocols !== undefined) {
            return new OriginalWebSocket(url, protocols);
          }
          return new OriginalWebSocket(url);
        }

        PatchedWebSocket.prototype = OriginalWebSocket.prototype;
        PatchedWebSocket.CONNECTING = 0;
        PatchedWebSocket.OPEN = 1;
        PatchedWebSocket.CLOSING = 2;
        PatchedWebSocket.CLOSED = 3;

        window.WebSocket = PatchedWebSocket;
      })();

      // Suppress non-critical errors (Vite HMR, WebSockets, ResizeObserver, media loading errors)
      window.addEventListener('error', function(e) {
        if (!e) return;

        // Ignore element resource errors (broken image links, audio/video elements, external stylesheets)
        if (e.target && (e.target.tagName === 'IMG' || e.target.tagName === 'LINK' || e.target.tagName === 'AUDIO' || e.target.tagName === 'VIDEO' || e.target.tagName === 'IFRAME')) {
          return;
        }

        var msg = (e.message || '') + ' ' + (e.filename || '');
        if (msg.includes('WebSocket') || msg.includes('@vite/client') || msg.includes('ModuleRunner') || msg.includes('transport') || msg.includes('hmr') || msg.includes('vite-hmr') || msg.includes('ResizeObserver')) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          return;
        }

        var initLoader = document.getElementById('init-loader');
        if (initLoader && e.error && e.message) {
          console.warn('Captured early initialization warning:', { message: e.message, filename: e.filename, lineno: e.lineno, error: e.error });
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        if (!e) return;
        var reason = e.reason ? (e.reason.message || String(e.reason)) : '';
        if (reason.includes('WebSocket') || reason.includes('@vite/client') || reason.includes('ModuleRunner') || reason.includes('transport') || reason.includes('vite-hmr') || reason.includes('closed without opened') || reason.includes('ResizeObserver')) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      }, true);

      // Smooth initial loading status update if bundle compilation takes longer in dev environment
      /* setTimeout(function() {
        var loader = document.getElementById('init-loader');
        if (loader) {
          var status = document.getElementById('init-status');
          if (status) {
            status.innerText = 'ПОДКЛЮЧЕНИЕ МОДУЛЕЙ И ИГРОВОЙ БАЗЫ RUST...';
          }
        }
      }, 4000); */

      // Fail visibly instead of leaving the initial loader on screen forever.
      // If this fires, the application entry bundle did not replace #init-loader.
      window.setTimeout(function() {
        var loader = document.getElementById('init-loader');
        if (!loader || !loader.isConnected) return;

        var status = document.getElementById('init-status');
        if (status) {
          status.textContent = 'ЗАПУСК НЕ УДАЛСЯ: СКРИПТЫ ПРИЛОЖЕНИЯ НЕ ЗАГРУЗИЛИСЬ';
          status.style.color = '#ff6b5c';
          status.style.maxWidth = '520px';
          status.style.lineHeight = '1.7';
          status.style.whiteSpace = 'normal';
        }

        var details = document.createElement('p');
        details.textContent = 'Обновите страницу. Если сообщение повторяется, откройте F12 → Console и Network: проверьте ошибки загрузки файлов JavaScript.';
        details.style.cssText = 'max-width:520px;font-size:12px;line-height:1.7;color:#94a3b8;margin:12px 0 16px';
        loader.appendChild(details);

        var retry = document.createElement('button');
        retry.type = 'button';
        retry.textContent = 'ПОВТОРИТЬ ЗАГРУЗКУ';
        retry.style.cssText = 'border:1px solid #cd412b;background:#cd412b;color:#fff;padding:10px 16px;border-radius:4px;font:700 12px monospace;cursor:pointer';
        retry.addEventListener('click', function() { window.location.reload(); });
        loader.appendChild(retry);

        var spinner = loader.querySelector('div[style*="border-radius: 50%"]');
        if (spinner) spinner.style.display = 'none';
      }, 20000);
